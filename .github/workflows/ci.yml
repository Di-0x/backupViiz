name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pour économiser les minutes GitHub : définir la variable de dépôt RUNNER=self-hosted
    # (Settings > Secrets and variables > Actions > Variables) pour utiliser votre propre machine.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
