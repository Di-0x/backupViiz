name: Docker image

# Construit l'image à chaque pull request et à chaque push sur main, la publie sur GitHub
# Container Registry (ghcr.io) et teste son démarrage avant publication.
#   PR #12  -> ghcr.io/<owner>/backupviiz:pr-12
#   main    -> ghcr.io/<owner>/backupviiz:latest et :sha-<commit>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Variable de dépôt RUNNER=self-hosted pour ne pas consommer de minutes GitHub.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Les PR venant d'un fork n'ont pas le droit d'écrire dans le registre.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Métadonnées de l'image (noms en minuscules)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local pour le test de démarrage
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: backupviiz:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de démarrage
        run: |
          docker run -d --name bv -p 3000:3000 backupviiz:smoke
          for i in $(seq 1 20); do curl -fs http://localhost:3000/api/health && echo && exit 0; sleep 1; done
          docker logs bv; exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Résumé
        run: |
          {
            echo "### Image publiée"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/docker pull /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
